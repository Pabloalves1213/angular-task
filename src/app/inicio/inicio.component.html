<mat-icon aria-hidden="false" aria-label="Example home icon">home</mat-icon>


<a mat-stroked-button href="http://localhost:4200/servico" target="_blank">Pagina servico</a>
<mat-card>Ola mundo!!</mat-card>



<form class="example-form">
  <mat-form-field class="example-full-width" appearance="fill">
    <mat-label>Comida preferida</mat-label>
    <input matInput placeholder="Ex. Pizza" value="Batatinha">
  </mat-form-field>

  <mat-form-field class="example-full-width" appearance="fill">
    <mat-label>Descreva um pouco mais seu prato</mat-label>
    <textarea matInput placeholder="Ex. Gosto com muita bata..."></textarea>
  </mat-form-field>
</form>


<table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

  <!--- Note that these columns can be defined in any order.
        The actual rendered columns are set as a property on the row definition" -->

  <!-- Position Column -->
  <ng-container matColumnDef="position">
    <th mat-header-cell *matHeaderCellDef> No. </th>
    <td mat-cell *matCellDef="let element"> {{element.position}} </td>
  </ng-container>

  <!-- Name Column -->
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef> Name </th>
    <td mat-cell *matCellDef="let element"> {{element.name}} </td>
  </ng-container>

  <!-- Weight Column -->
  <ng-container matColumnDef="weight">
    <th mat-header-cell *matHeaderCellDef> Weight </th>
    <td mat-cell *matCellDef="let element"> {{element.weight}} </td>
  </ng-container>

  <!-- Symbol Column -->
  <ng-container matColumnDef="symbol">
    <th mat-header-cell *matHeaderCellDef> Symbol </th>
    <td mat-cell *matCellDef="let element"> {{element.symbol}} </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
